
services:
  nextjs:
    build:
      context: .
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules

    networks:
      - nextjs_network


  nginx:
    image: nginx:latest
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - nextjs_network

networks:
  nextjs_network:
    driver: bridge




