
services:
  app:
    build:
      context: .
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/app
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    networks:
      - nextjs_network

networks:
  nextjs_network:
    driver: bridge
