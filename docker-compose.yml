
services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/app
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    networks:
      - nextjs_network


  nginx:
    image: nginx:latest
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

networks:
  nextjs_network:
    driver: bridge




